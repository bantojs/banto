name = "banto-plugin-webp"
main = "src/index.ts"
compatibility_date = "2025-10-01"

# 変換は Cloudflare Images（無料プランは 1 か月 5,000 回の変換。1 枚で本画像とサムネイルの 2 回）
[images]
binding = "IMAGES"

# 前からの画像・枠が切れて止まった分を見回る（1 回に SWEEP_BUDGET 枚、既定 20）
[triggers]
crons = ["17 * * * *"]

# 変数とシークレットは Cloudflare の画面（Workers & Pages → banto-plugin-webp → 設定 → 変数とシークレット）か
#   wrangler secret put BANTO_HOOK_SECRET / BANTO_API_TOKEN で入れる。BANTO_API_URL・BANTO_MEDIA_URL は変数でよい
